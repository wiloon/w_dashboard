version: '3'

tasks:
  # The only way to start the app in a dev checkout: picks the native app for the current OS.
  run:
    desc: Build and run w_dashboard for the current OS (Linux / macOS / Windows)
    vars:
      TARGET: '{{if eq OS "windows"}}run:windows{{else if eq OS "darwin"}}run:macos{{else}}run:linux{{end}}'
    cmds:
      - task: '{{.TARGET}}'

  run:linux:
    internal: true
    dir: app-linux
    cmds:
      - cargo run

  # A real .app bundle, so keyboard/menu behavior (e.g. Cmd+V in dialogs) is correct.
  run:macos:
    internal: true
    dir: app-macos
    cmds:
      - ./Scripts/build-app.sh
      - open dist/WDashboard.app

  run:windows:
    internal: true
    dir: app-windows
    cmds:
      - dotnet run --project src/WDashboard.App

  build:
    desc: Build the Linux app
    dir: app-linux
    cmds:
      - cargo build

  test:
    desc: Run app-linux tests (includes docs/test-vectors contract tests)
    dir: app-linux
    cmds:
      - cargo test

  plasmoid:install:
    desc: Install/upgrade the KDE Plasma pomodoro-clock widget (see app-linux/plasmoid/README.md)
    dir: app-linux/plasmoid
    cmds:
      - kpackagetool6 -t Plasma/Applet -u dev.wdashboard.pomodoroclock || kpackagetool6 -t Plasma/Applet -i dev.wdashboard.pomodoroclock

  macos:install:
    desc: Build, install WDashboard.app into ~/Applications (Spotlight-searchable) and register a login-item LaunchAgent
    dir: app-macos
    cmds:
      - ./Scripts/install-macos.sh

  macos:uninstall:
    desc: Remove the ~/Applications install and the login-item LaunchAgent
    dir: app-macos
    cmds:
      - ./Scripts/uninstall-macos.sh

  macos-build:
    desc: Build the macOS app
    dir: app-macos
    cmds:
      - swift build

  macos-test:
    desc: Run app-macos tests (includes docs/test-vectors contract tests)
    dir: app-macos
    cmds:
      - swift test

  windows:build:
    desc: Build the Windows solution (Core, App, tests)
    dir: app-windows
    cmds:
      - dotnet build WDashboard.sln

  windows:test:
    desc: Run app-windows tests (includes docs/test-vectors contract tests; ping-output does not apply)
    dir: app-windows
    cmds:
      - dotnet test tests/WDashboard.Core.Tests
