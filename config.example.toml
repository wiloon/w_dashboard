# w_dashboard config template. Copy to $XDG_CONFIG_HOME/w_dashboard/config.toml
# (falls back to ~/.config/w_dashboard/config.toml) and edit as needed.
# See docs/sdd.md §4 for the full schema.

[general]
# Background auto-refresh interval in seconds. 0 = manual refresh only.
refresh_interval_secs = 900
# Timeout (seconds) for each subprocess call (git, chezmoi).
command_timeout_secs = 20
# Whether to run `git fetch` / chezmoi fetch on refresh (requires network).
fetch_remote = true

# Repos to watch (explicit absolute paths).
[[repos]]
path = "~/workspace/projects/foo"
# Optional: override the display name; defaults to the directory name.
name = "foo"

[[repos]]
path = "~/dotfiles-extra"

[chezmoi]
enabled = true
# Optional: explicit chezmoi source dir; defaults to `chezmoi source-path`.
# source_path = "~/.local/share/chezmoi"

[[clocks]]
label = "Beijing"
tz = "Asia/Shanghai"

[[clocks]]
label = "New York"
tz = "America/New_York"

[weather]
# Either a location name (resolved via geocoding) or explicit lat/long.
location = "Beijing"
# latitude = 39.9042
# longitude = 116.4074
temperature_unit = "celsius"
forecast_days = 5

[pomodoro]
# Enable the Pomodoro panel and tray/menu-bar icon state. false = panel hidden,
# tray keeps only its existing "click to summon window" behavior.
enabled = true
# Focus session length in minutes.
focus_minutes = 25
# Break session length in minutes.
break_minutes = 5
# Post one system notification when a session ends.
notify = true
# Play a sound once when a session ends.
sound = true
# Flash the tray / menu-bar icon each morning (Beijing time) if no focus session
# has been started yet that day. Stops for the day once the first focus starts.
# false = no morning nudge.
morning_nudge = true
# Beijing wall-clock time-of-day ("HH:MM", 24h) after which the morning nudge starts.
morning_nudge_after = "09:00"

[network]
# Enable the "Network" tab and its probes (docs/sdd.md §12). false = no tab, no probing.
enabled = true
# Light probe (latency / loss / jitter) interval in seconds. 0 = only on startup,
# network change and manual "re-check".
probe_interval_secs = 60
# Samples per target per probe round (1-50).
probe_samples = 10
# Per-sample timeout in milliseconds (100-10000).
probe_timeout_ms = 2000
# Manual speed test: per-direction caps; whichever is hit first stops that step.
speedtest_max_secs = 8
speedtest_max_mb = 25
speedtest_domestic_download_url = "https://mensura.cdn-apple.com/api/v1/gm/large"
speedtest_domestic_upload_url = "https://mensura.cdn-apple.com/api/v1/gm/slurp"
speedtest_overseas_download_url = "https://speed.cloudflare.com/__down?bytes=25000000"
speedtest_overseas_upload_url = "https://speed.cloudflare.com/__up"

# Probe targets. With no [[network_targets]] at all, these five built-in defaults
# are used; once you write any, the config list fully replaces the defaults.
# group: "domestic" | "overseas" | "home"
# method: "http" (default; needs url) | "tcp" (needs host + port)
[[network_targets]]
label = "AliDNS"
group = "domestic"
url = "https://223.5.5.5/"

[[network_targets]]
label = "Baidu"
group = "domestic"
url = "https://www.baidu.com/favicon.ico"

[[network_targets]]
label = "Cloudflare"
group = "overseas"
url = "https://1.1.1.1/cdn-cgi/trace"

[[network_targets]]
label = "GitHub"
group = "overseas"
url = "https://github.com/robots.txt"

[[network_targets]]
label = "Home"
group = "home"
method = "tcp"
host = "home.wiloon.com"
port = 443
